[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "audio-notes"
dynamic = ["version"]
description = "Lightweight tray tool: capture system audio, transcribe locally, expose the transcript to Claude via MCP."
readme = "docs/pypi.md"  # PyPI page (absolute links only); README.md is the GitHub page
requires-python = ">=3.10"
keywords = ["audio", "transcription", "whisper", "mcp", "claude", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "mcp>=1.2",
    "numpy",
    "faster-whisper>=1.0",
    "soxr",
    "pystray",
    "Pillow",
    "starlette",
    "uvicorn",
    "PyAudioWPatch; sys_platform == 'win32'",
]

[project.scripts]
audio-notes = "audio_notes.cli:app"

[project.urls]
Homepage = "https://github.com/zohoMatt/audio-notes"
Repository = "https://github.com/zohoMatt/audio-notes"
Issues = "https://github.com/zohoMatt/audio-notes/issues"

[dependency-groups]
dev = ["pytest", "httpx"]
build = ["pyinstaller>=6.10"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_notes"]

# The sdist is for building and testing the package, not a copy of the repo: no demos, scripts,
# installer, CI workflows, lock file or design notes.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs/pypi.md", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv]
# The version comes from git tags (hatch-vcs). Without these keys uv never reinstalls the project
# when only the commit or tag changes, so `--version` (and locally built installers) go stale.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware'"
markers = [
    "slow: uses the real ASR model",
    "e2e: end-to-end without audio hardware",
    "hardware: needs a real audio device; skipped by default",
]
