[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "audio-notes"
dynamic = ["version"]
description = "Lightweight tray tool: capture system audio, transcribe locally, expose the transcript to Claude via MCP."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "mcp>=1.2",
    "numpy",
    "faster-whisper>=1.0",
    "soxr",
    "pystray",
    "Pillow",
    "starlette",
    "uvicorn",
    "PyAudioWPatch; sys_platform == 'win32'",
]

[project.scripts]
audio-notes = "audio_notes.cli:app"

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware'"
markers = [
    "slow: uses the real ASR model",
    "e2e: end-to-end without audio hardware",
    "hardware: needs a real audio device; skipped by default",
]
